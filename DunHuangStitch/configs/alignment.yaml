seed: 42
device: cuda
amp: true
data:
  root: data
  image_size: [128, 128]
  perturb_range: 32 # engineering default; not reported in paper
model:
  num_stages: 3
  feature_channels: [32, 48, 64] # engineering default
  focus: {out_channels: 32}
  hab: {activation: gelu, dw_kernel: 7, window_size: 8, num_heads: [2, 3, 4], mlp_ratio: 2.0, residual: true}
  search_ranges: [16, 8, 4]
  aprb: {output_channels: 49, attention_reduction: 4, conv_layers: 2}
  hpb: {hidden_channels: 64, conv_layers: 2}
  homography: {type: global, eps: 1.0e-6}
loss: {type: l1, stage_weights: [1.0, 4.0, 16.0]}
training: {epochs: 200, batch_size: 8, optimizer: adamw, lr: 1.0e-4, weight_decay: 1.0e-4, betas: [0.9, 0.999], warmup_epochs: 20, scheduler: exponential, scheduler_gamma: 0.98, workers: 4}
